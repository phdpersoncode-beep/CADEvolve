# CC-step: same converter as CC-for, with each parameter group placed directly
# above the modelling step that consumes it instead of in one leading preamble.
root_dir: sampled
out_dir: cc_step
report_path: logs/cc_step.jsonl
flat: false

n_workers: 1
loop_mode: preserve
parameter_placement: late
max_unroll_iterations: 64

validate_execution: true
validate_prefix_execution: true
validate_perturbations: false
max_perturbed_parameters: 16
keep_failed: false

# Enforced by the parent process, including native OpenCascade hangs.
job_timeout: 120
# Compare occupied volume in the original coordinate frame, in addition to
# topology/mass signatures. No independent centering/scaling during this check.
validate_boolean_geometry: true
